name: Android

# Gradle tidak bisa jalan di VM dev (network Java diblokir sandbox),
# jadi CI adalah otoritas build. Tidak ada Gradle wrapper yang di-commit;
# action setup-gradle menyediakan Gradle 8.2 (sesuai AGP 8.2.2).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cek-obat-355-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
